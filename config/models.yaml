# Model registry for `als run`. One entry per model under test.
#
# Sampling note (methodology): current Claude API models reject `temperature`,
# `top_p` and `top_k` (HTTP 400), so API models run at the provider's default
# sampling. Local models run at a fixed temperature + seed. This asymmetry is
# recorded per run in runs.params_json and must be stated in the writeup.
# Repeats (5 per prompt x model) are what measure recurrence either way.

budget:
  total_usd: 60.0          # hard cap across all models; `als run` stops when reached
  log_spend: true

defaults:
  runs: 5
  max_tokens: 4096

models:
  - key: claude-opus-5-5
    provider: anthropic
    model_id: claude-opus-5-5
    effort: medium           # Opus 5.5 default is medium; set explicitly so it is recorded
    max_tokens: 8000
    budget_usd: 45.0
    pricing_per_mtok: {input: 4.00, output: 20.00}
    # Server-side refusal fallbacks would silently swap the answering model and
    # corrupt per-model attribution, so they are OFF for measurement runs.
    # Refusals are recorded (stop_reason) and reported as their own category.
    fallbacks: false
    enabled: true

  # --- Open models via OpenAI-compatible hosted endpoints. Keys read from env at
  # call time (NVIDIA_API_KEY / GROQ_API_KEY); never stored in results. Model ids
  # below are reasonable current choices - run `python scripts/test_providers.py`
  # first to confirm each key sees them, and swap in whatever `/models` lists.
  # Confirmed callable on this Groq account 2026-11-07 (python scripts/test_providers.py groq).
  - key: groq-gptoss20b
    provider: groq
    model_id: openai/gpt-oss-20b
    temperature: 0.7
    seed_base: 1000          # run_idx is added, so each repeat is independent but reproducible
    max_tokens: 6000         # gpt-oss spends tokens on reasoning; give the visible answer room
    budget_usd: 0            # priced separately; set a cap if you want one
    enabled: true

  - key: groq-gptoss120b
    provider: groq
    model_id: openai/gpt-oss-120b
    temperature: 0.7
    seed_base: 1000
    max_tokens: 6000
    budget_usd: 0
    enabled: true

  # NVIDIA ids below are from the account's actual /models catalog (2026-11-07).
  # Confirm each is callable with `python scripts/test_providers.py nvidia` before a full run.
  - key: nvidia-nemotron70b
    provider: nvidia
    model_id: nvidia/llama-3.1-nemotron-70b-instruct
    temperature: 0.7
    seed_base: 1000
    budget_usd: 0
    enabled: true

  - key: nvidia-granite8b
    provider: nvidia
    model_id: ibm/granite-3.0-8b-instruct
    temperature: 0.7
    seed_base: 1000
    budget_usd: 0
    enabled: true

  # Optional local models (Ollama) - disabled until a server is running.
  - key: ollama-qwen
    provider: ollama
    model_id: qwen2.5-coder:7b
    temperature: 0.7
    seed_base: 1000
    endpoint: http://localhost:11434
    budget_usd: 0
    enabled: false

  # Deterministic canned-output runner used by tests and dry runs. Never part of results.
  - key: stub
    provider: stub
    model_id: stub
    enabled: false
